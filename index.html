<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: -apple-system, sans-serif; }
        #webcam-container { width: 100%; display: flex; justify-content: center; }
        canvas { width: 100% !important; height: auto !important; }
        .boton-ios { padding: 25px 50px; font-size: 22px; background: #28a745; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <button id="iniciar" class="boton-ios" onclick="activar()">TOCA AQUÍ PARA ESCANEAR</button>
    <div id="webcam-container"></div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/8e7JeaSIh/";
        let model, webcam;

        async function activar() {
            // 1. Ocultamos el botón para que no estorbe
            document.getElementById('iniciar').style.display = 'none';
            
            try {
                // 2. Cargamos el modelo
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                
                // 3. Iniciamos la cámara (iOS requiere que esto pase justo después de un clic)
                webcam = new tmImage.Webcam(window.innerWidth, window.innerWidth, false);
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                
                window.requestAnimationFrame(loop);
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            } catch (e) {
                alert("Error crítico: " + e);
            }
        }

        async function loop() {
            webcam.update();
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < model.getTotalClasses(); i++) {
                if (prediction[i].probability > 0.40) { // Probabilidad para tus pulgones
                    if (typeof ThunkableWebviewerActivity !== "undefined") {
                        ThunkableWebviewerActivity.postMessage(prediction[i].className);
                    }
                }
            }
            window.requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
