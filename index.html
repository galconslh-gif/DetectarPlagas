<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; background-color: black; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: -apple-system, sans-serif; }
        #webcam-container { width: 100%; display: flex; justify-content: center; }
        canvas { width: 100% !important; height: auto !important; }
        #btn-iniciar { padding: 20px 40px; font-size: 18px; background-color: #28a745; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 10px; font-size: 14px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <button id="btn-iniciar" onclick="comenzar()">ACTIVAR ESCÁNER</button>
    <div id="status">Toca el botón para permitir el acceso</div>
    <div id="webcam-container"></div>

    <script type="text/javascript">
        // Usamos tu link de Teachable Machine
        const URL = "https://teachablemachine.withgoogle.com/models/8e7JeaSIh/";
        let model, webcam, maxPredictions;

        async function comenzar() {
            document.getElementById("btn-iniciar").style.display = "none";
            document.getElementById("status").innerHTML = "Iniciando cámara...";
            await init();
        }

        async function init() {
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = false;
                webcam = new tmImage.Webcam(window.innerWidth, window.innerWidth, flip);
                
                // Configuración para cámara trasera en iPhone
                await webcam.setup({ facingMode: "environment" }); 
                
                await webcam.play();
                document.getElementById("status").style.display = "none";
                window.requestAnimationFrame(loop);
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            } catch (e) {
                document.getElementById("status").innerHTML = "Error: " + e;
                console.error(e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                // Probabilidad de 0.35 para detectar tus pulgones
                if (prediction[i].probability > 0.35) {
                    if (typeof ThunkableWebviewerActivity !== "undefined") {
                        ThunkableWebviewerActivity.postMessage(prediction[i].className);
                    }
                }
            }
        }
    </script>
</body>
</html>
