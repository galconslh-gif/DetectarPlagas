<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        #webcam-container { width: 100%; display: flex; justify-content: center; position: absolute; top: 0; }
        canvas { width: 100% !important; height: auto !important; }
        .boton-ios { padding: 25px 50px; font-size: 22px; background: #28a745; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #status-bar { position: absolute; bottom: 20px; background: rgba(0,0,0,0.8); padding: 12px 25px; border-radius: 10px; font-size: 18px; color: #ffc107; z-index: 100; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <button id="iniciar" class="boton-ios" onclick="activar()">TOCA PARA ANALIZAR</button>
    <div id="status-bar">ESCANEANDO...</div>
    <div id="webcam-container"></div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/8e7JeaSIh/"; 
        let model, webcam;
        let escanearActivo = false;

        async function activar() {
            document.getElementById('iniciar').style.display = 'none';
            document.getElementById('status-bar').style.display = 'block';
            
            try {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                webcam = new tmImage.Webcam(window.innerWidth, window.innerWidth, false);
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                escanearActivo = true;

                // Temporizador de 6 segundos
                setTimeout(() => {
                    escanearActivo = false;
                    document.getElementById('status-bar').innerHTML = "ESCANEO FINALIZADO";
                    document.getElementById('status-bar').style.color = "#28a745";
                }, 6000);

                window.requestAnimationFrame(loop);
            } catch (e) {
                alert("Error de cámara: " + e);
            }
        }

        async function loop() {
            if (webcam) {
                webcam.update();
                if (escanearActivo) { await predict(); }
            }
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < model.getTotalClasses(); i++) {
                if (prediction[i].probability > 0.45) { 
                    const resultado = prediction[i].className;
                    
                    // TRIPLE INTENTO DE ENVÍO (Para romper el bloqueo de iOS)
                    try {
                        // 1. Intento estándar de Thunkable
                        if (typeof ThunkableWebviewerActivity !== "undefined") {
                            ThunkableWebviewerActivity.postMessage(resultado);
                        }
                        // 2. Intento para iOS moderno (ReactNative)
                        if (window.ReactNativeWebView) {
                            window.ReactNativeWebView.postMessage(resultado);
                        }
                        // 3. Intento universal
                        window.postMessage(resultado, "*");
                    } catch (e) {
                        // Silencioso
                    }
                }
            }
        }
    </script>
</body>
</html>
