<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; background-color: black; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { width: 100% !important; height: auto !important; }
        #setup-layer { position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:flex; justify-content:center; align-items:center; z-index:10; }
        button { padding:20px 40px; font-size:20px; cursor:pointer; background:#28a745; color:white; border:none; border-radius:10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="setup-layer">
        <button onclick="startApp()">ACTIVAR CÁMARA</button>
    </div>
    <div id="webcam-container"></div>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/8e7JeaSIh/";
        let model, webcam, maxPredictions;

        async function startApp() {
            document.getElementById('setup-layer').style.display = 'none';
            await init(); 
        }

        async function init() {
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                webcam = new tmImage.Webcam(window.innerWidth, window.innerWidth, false);
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                window.requestAnimationFrame(loop);
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            } catch (e) {
                alert("Error al iniciar cámara: " + e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                // Probabilidad de 0.40 para detectar tus Pulgones (53%)
                if (prediction[i].probability > 0.40) {
                    if (typeof ThunkableWebviewerActivity !== "undefined") {
                        ThunkableWebviewerActivity.postMessage(prediction[i].className);
                    }
                }
            }
        }
    </script>
</body>
</html>
