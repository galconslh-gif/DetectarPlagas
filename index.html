<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; background-color: black; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        canvas { width: 100% !important; height: auto !important; border: 2px solid #28a745; }
        #btn-start { padding: 20px 40px; font-size: 20px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <button id="btn-start" onclick="startCamera()">ACTIVAR ESCÁNER</button>
    <div id="webcam-container"></div>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/8e7JeaSIh/";
        let model, webcam, maxPredictions;

        async function startCamera() {
            document.getElementById('btn-start').style.display = 'none';
            await init();
        }

        async function init() {
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Cambiado a 'true' para probar compatibilidad si 'false' falló
                webcam = new tmImage.Webcam(window.innerWidth, window.innerWidth, true);
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                window.requestAnimationFrame(loop);
                document.getElementById("webcam-container").appendChild(webcam.canvas);
            } catch (e) {
                alert("Error de cámara: " + e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > 0.35) {
                    if (typeof ThunkableWebviewerActivity !== "undefined") {
                        ThunkableWebviewerActivity.postMessage(prediction[i].className);
                    }
                }
            }
        }
    </script>
</body>
</html>
